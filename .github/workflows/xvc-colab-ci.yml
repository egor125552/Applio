name: X-VC Colab CI

on:
  push:
    branches:
      - agent/xvc-gradio
    paths:
      - "xvc_colab/**"
      - ".github/workflows/xvc-colab-ci.yml"
  pull_request:
    paths:
      - "xvc_colab/**"
      - ".github/workflows/xvc-colab-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xvc-colab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -q pytest
      - run: pytest -q xvc_colab/tests/test_contract.py
      - run: python -m json.tool xvc_colab/X_VC_Colab.ipynb >/dev/null

  gradio-share-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Pull official Google Colab runtime image
        run: docker pull us-docker.pkg.dev/colab-images/public/cpu-runtime

      - name: Create exactly one Gradio public link inside official Colab runtime
        run: |
          docker run --rm \
            --entrypoint /bin/bash \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            us-docker.pkg.dev/colab-images/public/cpu-runtime \
            -lc 'python -m pip install -q gradio==5.23.0 requests && timeout 120s python xvc_colab/tests/smoke_gradio_share.py'

  dependency-and-import-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Checkout pinned official X-VC
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/Jerrister/X-VC.git "$RUNNER_TEMP/X-VC"
          git -C "$RUNNER_TEMP/X-VC" fetch --depth 1 origin 49df8c591eafc48b096e466d96f9839f9c0dd739
          git -C "$RUNNER_TEMP/X-VC" checkout --detach 49df8c591eafc48b096e466d96f9839f9c0dd739
          test "$(git -C "$RUNNER_TEMP/X-VC" rev-parse HEAD)" = "49df8c591eafc48b096e466d96f9839f9c0dd739"

      - name: Install CPU PyTorch
        run: |
          python -m pip install -q --upgrade pip setuptools wheel
          python -m pip install -q \
            torch==2.5.1 torchaudio==2.5.1 torchvision==0.20.1 \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Install official X-VC dependencies
        run: python -m pip install -q -r "$RUNNER_TEMP/X-VC/requirements.txt"

      - name: Install wrapper dependencies
        run: python -m pip install -q -r xvc_colab/requirements-colab.txt

      - name: Import official inference path
        env:
          PYTHONPATH: ${{ runner.temp }}/X-VC
        run: |
          python - <<'PY'
          from bins.infer_utils import load_xvc, load_pair_as_tensors, run_offline, run_streaming
          print('official X-VC inference imports OK')
          PY

      - name: Import Gradio wrapper without loading model weights
        env:
          XVC_ROOT: ${{ runner.temp }}/X-VC
        run: |
          python - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location('xvc_gradio', 'xvc_colab/app.py')
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          assert mod.demo is not None
          print('Gradio wrapper import OK')
          PY

      - name: Verify Hugging Face model metadata
        run: |
          python - <<'PY'
          from huggingface_hub import HfApi
          api = HfApi()
          xvc = api.model_info('chenxie95/X-VC')
          assert any(s.rfilename == 'xvc.pt' for s in xvc.siblings)
          tokenizer = api.model_info('zai-org/glm-4-voice-tokenizer')
          assert tokenizer.siblings
          print('remote model metadata OK')
          PY
